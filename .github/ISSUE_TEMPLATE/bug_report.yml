name: 不具合の報告
description: タイムバケットで起きた不具合を報告する
title: "[不具合] "
body:
  - type: markdown
    attributes:
      value: |
        投稿内容は公開されます。個人の写真・メモ、生年月日、バックアップファイル、認証情報は添付しないでください。
        記録が表示されない場合も、アプリの削除・再インストールはせず、そのままの状態でご相談ください。
  - type: input
    id: app_version
    attributes:
      label: アプリのバージョン
      description: わからない場合は「不明」と記入してください。
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhoneの機種とiOSのバージョン
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 起きたこと
      description: 個人情報を含めず、エラー表示や症状を記載してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 直前に行った操作、通常／デモのどちらか、毎回起きるかを記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待していた動作
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開内容の確認
      options:
        - label: 投稿は公開されることを理解し、個人情報やバックアップファイルを含めていません。
          required: true
